<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Brasão do Corpo de Bombeiros Militar de Rondônia">
  <!-- disco e anéis -->
  <circle cx="100" cy="100" r="99" fill="#ffffff"/>
  <circle cx="100" cy="100" r="97" fill="#e2231a"/>
  <circle cx="100" cy="100" r="93" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="71" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <defs>
    <path id="arc-top" d="M 100,100 m -82,0 a 82,82 0 1,1 164,0"/>
    <path id="arc-bot" d="M 100,100 m -78,0 a 78,78 0 0,0 156,0"/>
  </defs>
  <text font-family="Outfit, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.6">
    <textPath href="#arc-top" startOffset="50%" text-anchor="middle">CORPO DE BOMBEIROS MILITAR DE RONDÔNIA</textPath>
  </text>
  <text font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="3">
    <textPath href="#arc-bot" startOffset="50%" text-anchor="middle">— 1998 —</textPath>
  </text>

  <!-- emblema central -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- machados cruzados -->
    <g stroke="#ffffff" stroke-width="5" fill="#ffffff">
      <line x1="66" y1="138" x2="126" y2="70"/>
      <line x1="134" y1="138" x2="74" y2="70"/>
      <path d="M 122,66 l 16,-6 l 2,16 z"/>
      <path d="M 78,66 l -16,-6 l -2,16 z"/>
    </g>
    <!-- sabres cruzados (cabos amarelos) -->
    <g stroke="#ffffff" stroke-width="3" fill="none">
      <path d="M 70,150 C 92,140 100,120 100,108"/>
      <path d="M 130,150 C 108,140 100,120 100,108"/>
    </g>
    <line x1="66" y1="152" x2="74" y2="146" stroke="#f5c518" stroke-width="5"/>
    <line x1="134" y1="152" x2="126" y2="146" stroke="#f5c518" stroke-width="5"/>

    <!-- estrela de Rondônia (4 pontas) -->
    <path d="M 100,86 L 108,108 L 130,116 L 108,124 L 100,146 L 92,124 L 70,116 L 92,108 Z"
          fill="#e2231a" stroke="#ffffff" stroke-width="3"/>
    <text x="100" y="120" font-family="Outfit, Arial, sans-serif" font-size="11" font-weight="800"
          fill="#ffffff" text-anchor="middle">RO</text>

    <!-- tocha central -->
    <rect x="96.5" y="92" width="7" height="58" rx="2" fill="#f5c518" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M 90,92 L 110,92 L 106,100 L 94,100 Z" fill="#f5c518" stroke="#ffffff" stroke-width="1.5"/>
    <!-- chama -->
    <path d="M 100,58 C 110,70 110,82 100,90 C 90,82 90,70 100,58 Z" fill="#ff7a00" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M 100,66 C 105,73 105,82 100,88 C 95,82 95,73 100,66 Z" fill="#f5c518"/>
  </g>
</svg>
